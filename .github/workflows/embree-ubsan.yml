name: Embree UBSan repro

on:
  push:
    branches:
      - embree-ubsan-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang reports both the incompatible function-pointer calls and the downcast.
          - name: clang-18
            cc: clang-18
            cxx: clang++-18
          # GCC does not implement -fsanitize=function, so it reports only the downcast.
          - name: gcc-13
            cc: gcc-13
            cxx: g++-13
    name: ${{ matrix.name }}
    env:
      EMBREE_REVISION: 3d9cb89b9ea099c630e6272d37767e7dd4e78e74
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out Embree
        run: |
          git init embree
          git -C embree remote add origin https://github.com/RenderKit/embree.git
          git -C embree fetch --depth=1 origin "$EMBREE_REVISION"
          git -C embree checkout --detach FETCH_HEAD

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target probe

      - name: Run with UBSan
        run: |
          UBSAN_OPTIONS=halt_on_error=0:print_stacktrace=1 ./build/probe 2>&1 | tee probe.log
          if grep -q 'runtime error:' probe.log; then
            echo '::error::UBSan reported undefined behavior in Embree (see log above).'
            exit 1
          fi
